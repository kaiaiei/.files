env = WLR_DRM_DEVICES,/dev/dri/card1
source = ~/.config/hypr/colors.conf

monitor=HDMI-A-2,1600x900@75,auto,1
###################
### MY PROGRAMS ###
###################
# Set programs that you use
$menu = rofi -show run
$music = kitty -e ncspot
$terminal = kitty
$browser = zen-browser

#################
### AUTOSTART ###
#################

exec-once = hypridle
exec-once = waybar
exec-once = fcitx5 -d --disable notification --replace
exec-once = awww-daemon
exec-once = /home/kai/.local/bin/wallpaper-restore
exec-once = /home/kai/.config/hypr/scripts/aes.sh
exec-once = [workspace special:magic silent] kitty -e ncspot

#############################
### ENVIRONMENT VARIABLES ###
#############################


# --- Graphics Handshake ---
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = WLR_DRM_DEVICES,/dev/dri/card1
env = WLR_NO_HARDWARE_CURSORS,1

# --- Input / Misc ---
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = XMODIFIERS,@im=fcitx
env = GLFW_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = ELECTRON_OZONE_PLATFORM_HINT,auto
###################
### PERMISSIONS ###
###################

#none

#####################
### LOOK AND FEEL ###
#####################

cursor {
    no_hardware_cursors = true
    inactive_timeout = 3
}

general {
    gaps_in = 10
    gaps_out = 14
    border_size = 2
    col.active_border = $secondary
    col.inactive_border = $outline_variant
    resize_on_border = true
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 0.5
    inactive_opacity = 0.5

    shadow {
        enabled = true
        range = 3
        render_power = 6
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
	noise = 0.015
	contrast = 0.89
	brightness = 1
        xray = false
        vibrancy = 0.1696
    }
}



animations {
  enabled = yes

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = been, 0.24, 0.9, 0.25, 0.91
  bezier = been2, 0,0.94,0.5,0.99
  bezier = menu_decel, 0.1, 1, 0, 1
  bezier = linear, 0.0, 0.0, 1.0, 1.0
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = slow, 0, 0.85, 0.3, 1
  bezier = overshot, 0.7, 0.6, 0.1, 1.1
  bezier = bounce, 1.1, 1.6, 0.1, 0.85
  bezier = sligshot, 1, -1, 0.15, 1.25
  bezier = nice, 0, 6.9, 0.5, -4.20
  
  animation = windowsIn, 1, 5, slow, popin
  animation = windowsOut, 1, 7, been, popin 70%
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, linear
  animation = fade, 1, 5, overshot
  animation = workspaces, 1, 5, wind
  animation = windows, 1, 5, bounce, popin
}

dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    session_lock_xray = true
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    scroll_method = on_button_down
    scroll_button = 274
    follow_mouse = 1
    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = km-5
    sensitivity = -0.5
    # Forces the device to be recognized as a mouse if it misidentifies as a keyboard/tablet
    accel_profile = flat
}
###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, O, exec, /home/kai/.local/bin/wlogout-hide
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, W, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod, S, exec, $music
bind = $mainMod, F, fullscreen
bind = $mainMod, C, exec, /home/kai/.config/hypr/scripts/clear-aes.sh
bind = $mainMod, R, exec, /home/kai/.config/hypr/scripts/aes.sh
bind = $mainMod, D, exec, kitty -e discordo
bind = $mainMod, X, exec, hyprshot -m region


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = ,mouse:BTN_MIDDLE, exec, pkill autoscroll.sh || ~/.config/hypr/autoscroll.sh

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################


windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
windowrule {
    name = kitty-fullscreen
    match:class = kitty
    match:fullscreen = true
    opacity = 0.5
}



windowrule {
    name = godot-general
    match:class = Godot
    opacity = 0.7 override
}

windowrule {
    name = godot-full
    match:class = Godot
    match:fullscreen = true
    opacity = 0.7 override
}


# Matrix Rain Terminal
windowrule {
    name = matrix-rain-layout
    match:title = matrix_rain
    float = true
    size = 593 404
    move = 89 169
}

# System Specs Fetch
windowrule {
    name = system-info-layout
    match:title = sys_info
    float = true
    size = 578 584
    move = 883 77
}

# Digital Desktop Clock
windowrule {
    name = desktop-clock-layout
    match:title = desktop_clock
    float = true
    size = 460 222
    move = 111 639
}

# Cava Audio Visualizer
windowrule {
    name = audio-visualizer-layout
    match:title = audio_viz
    float = true
    size = 612 289
    move = 516 522
}

windowrule {
    name = 1st-spotify
    match:class = spotify
    workspace = special:magic 
    no_focus = true
}

